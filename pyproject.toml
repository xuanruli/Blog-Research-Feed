[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-research-feed"
version = "0.2.9"
description = "AI-news aggregation: the `brf` tool CLI (agent-side) plus the `cron` package (host-side cron + Slack receiver)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Blog Research Feed" }]
dependencies = [
    "click",
    "anthropic",
    "firecrawl-py",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "youtube-transcript-api",
    "yt-dlp",
]

# feedparser is an extra (not a hard dep): its sgmllib3k build breaks the container install.
[project.optional-dependencies]
podcast = ["feedparser"]

[project.scripts]
brf = "brf.main:cli"

[tool.setuptools.packages.find]
include = ["brf*", "cron*"]

[tool.setuptools.package-data]
"brf.sources" = ["*.yaml", "*.opml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness + import-hygiene. BLE (blind-except) is intentionally NOT
# selected: this codebase deliberately swallows-and-logs per-source failures
# so one bad fetcher can't sink a run (see the `# noqa: BLE001` sites).
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # long lines are tolerated (URLs, docstrings, regexes)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]  # fixtures/mocks take liberties pytest is fine with
